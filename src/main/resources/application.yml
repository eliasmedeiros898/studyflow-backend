spring:
  application:
    name: studyflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/studyflow}
    username: ${DATABASE_USER:studyflow}
    password: ${DATABASE_PASSWORD:studyflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
studyflow:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-with-32-characters}
    token-duration: PT8H
    password-reset-duration: PT30M
    login-lock-duration: PT15M
    maximum-login-attempts: 5
    expose-development-reset-token: ${EXPOSE_DEVELOPMENT_RESET_TOKEN:true}
    password-reset-from: ${PASSWORD_RESET_FROM:noreply@studyflow.local}
management:
  endpoints:
    web:
      exposure:
        include: health,info
